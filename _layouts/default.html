<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="side-ad side-ad-left" href="{{ '/shop/' | relative_url }}" aria-label="Visit the shop"></a>

    <a class="ad-placeholder ad-placeholder-top" href="{{ '/shop/' | relative_url }}" aria-label="Visit the shop"></a>
    {% include site-header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    <a class="ad-placeholder ad-placeholder-bottom" href="{{ '/shop/' | relative_url }}" aria-label="Visit the shop"></a>
    <script src="{{ '/assets/js/type.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/logo.js' | relative_url }}"></script>
