---
title: Log in — Nerve pilot
description: Member login.
permalink: /login/
---

<section class="panel">
  <div class="panel-title">MEMBER LOG IN</div>
  <div class="panel-body">
    <form class="account-form" id="login-form">
      <label>Username<input type="text" name="username" autocomplete="username"></label>
      <label>Password<input type="password" name="password" autocomplete="current-password"></label>
      <button type="submit">LOG IN</button>
      <small class="account-caption">No account? <a href="{{ '/signup/' | relative_url }}">Sign up now.</a></small>
    </form>
    <p class="login-error" id="login-error" hidden>Incorrect username or password, jerk.</p>
  </div>
</section>

<script>
  const form = document.querySelector('#login-form');
  const error = document.querySelector('#login-error');
  const query = new URLSearchParams(window.location.search);

  if (query.get('error') === '1') {
    error.hidden = false;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    window.location.href = '{{ "/login/?error=1" | relative_url }}';
  });
</script>
